<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CodeArena – 540 Questions Placement Prep</title>
    <style>
         :root {
            --bg: #1e1e1e;
            --side: #252526;
            --bar: #333;
            --bd: #3c3c3c;
            --tx: #d4d4d4;
            --mut: #8b8b8b;
            --acc: #0e7ad1;
            --e: #4ec9b0;
            --m: #e5b84b;
            --h: #f2616b
        }
        
        * {
            box-sizing: border-box
        }
        
        html,
        body {
            height: 100%;
            margin: 0
        }
        
        body {
            background: var(--bg);
            color: var(--tx);
            font: 14px system-ui, -apple-system, Segoe UI, sans-serif;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }
        
        header {
            background: var(--bar);
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }
        
        .r1,
        .r2 {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }
        
        .r1 b {
            font-size: 16px
        }
        
        .sp {
            flex: 1
        }
        
        .pill {
            background: #2b2b2b;
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px
        }
        
        .bar {
            width: 120px;
            height: 6px;
            background: #111;
            border-radius: 3px;
            overflow: hidden
        }
        
        .bar i {
            display: block;
            height: 100%;
            background: var(--e)
        }
        
        .hist {
            display: flex;
            gap: 3px;
            align-items: center
        }
        
        .hist i {
            width: 10px;
            height: 14px;
            border-radius: 2px;
            background: #444
        }
        
        .chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px
        }
        
        .chip {
            flex: none;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid var(--bd);
            background: #2b2b2b;
            cursor: pointer;
            white-space: nowrap
        }
        
        .chip.on {
            background: var(--acc);
            border-color: var(--acc);
            color: #fff
        }
        
        main {
            flex: 1;
            display: flex;
            min-height: 0
        }
        
        aside {
            width: 310px;
            background: var(--side);
            border-right: 1px solid var(--bd);
            display: flex;
            flex-direction: column;
            min-height: 0
        }
        
        .flt {
            padding: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px
        }
        
        .flt input {
            grid-column: 1/3
        }
        
        input,
        select,
        button {
            background: #3a3d41;
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 4px;
            padding: 5px 8px;
            font: inherit
        }
        
        button {
            cursor: pointer
        }
        
        button:hover {
            background: #4a4d52
        }
        
        button.pr {
            background: var(--acc);
            border-color: var(--acc);
            color: #fff
        }
        
        #list {
            overflow: auto;
            flex: 1
        }
        
        .it {
            padding: 7px 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d
        }
        
        .it:hover {
            background: #2a2d2e
        }
        
        .it.on {
            background: #37373d
        }
        
        .it .t {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 1px solid var(--mut);
            flex: none
        }
        
        .dot.att {
            background: var(--m);
            border-color: var(--m)
        }
        
        .dot.done {
            background: var(--e);
            border-color: var(--e)
        }
        
        .E {
            color: var(--e)
        }
        
        .M {
            color: var(--m)
        }
        
        .H {
            color: var(--h)
        }
        
        .sm {
            font-size: 11px
        }
        
        .mu {
            color: var(--mut)
        }
        
        .ok {
            color: var(--e)
        }
        
        .bad {
            color: var(--h)
        }
        
        section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0
        }
        
        #prob {
            padding: 10px 14px;
            border-bottom: 1px solid var(--bd);
            max-height: 28%;
            overflow: auto
        }
        
        #prob h2 {
            margin: 0 0 4px;
            font-size: 16px
        }
        
        #prob p {
            margin: 6px 0;
            line-height: 1.5
        }
        
        .tag {
            font-size: 11px;
            background: #3a3d41;
            border-radius: 10px;
            padding: 1px 8px;
            margin-left: 6px;
            color: var(--tx)
        }
        
        .tabs {
            background: var(--side);
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid var(--bd);
            font-size: 12px;
            flex-wrap: wrap
        }
        
        .tabs .fn {
            background: var(--bg);
            padding: 4px 10px;
            border-top: 2px solid var(--acc)
        }
        
        .ed {
            flex: 1;
            display: flex;
            min-height: 120px
        }
        
        #ln {
            padding: 8px 6px;
            text-align: right;
            color: #6b6b6b;
            font: 13px/1.5 Consolas, Menlo, monospace;
            overflow: hidden;
            user-select: none;
            min-width: 38px;
            white-space: pre
        }
        
        #code {
            flex: 1;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--tx);
            font: 13px/1.5 Consolas, Menlo, monospace;
            padding: 8px;
            tab-size: 2;
            white-space: pre;
            overflow: auto
        }
        
        #out {
            height: 28%;
            min-height: 90px;
            overflow: auto;
            background: #181818;
            border-top: 1px solid var(--bd);
            padding: 8px 12px;
            font: 12.5px/1.5 Consolas, Menlo, monospace;
            white-space: pre-wrap
        }
        
        @media(max-width:760px) {
            main {
                flex-direction: column
            }
            aside {
                width: 100%;
                height: 36%;
                border-right: 0;
                border-bottom: 1px solid var(--bd)
            }
            #prob {
                max-height: 26%
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="r1"><b>⌨️ CodeArena</b><span class="pill" id="tot"></span><span class="pill E" id="pe"></span><span class="pill M" id="pm"></span><span class="pill H" id="ph"></span>
            <div class="bar"><i id="pb" style="width:0"></i></div><span class="sp"></span>
            <button id="nx">Next unsolved ▶</button><button id="ex">Export</button><button id="im">Import</button><input type="file" id="fi" accept=".json" hidden></div>
        <div class="r2"><span class="pill" id="today"></span><span class="pill" id="yest"></span><span class="pill" id="streak"></span><span class="hist" id="hist" title="Last 14 days (oldest → today)"></span></div>
        <div class="chips" id="chips"></div>
    </header>
    <main>
        <aside>
            <div class="flt"><input id="q" placeholder="Search problems…">
                <select id="fd"><option value="">All levels</option><option value="E">Easy</option><option value="M">Medium</option><option value="H">Hard</option></select>
                <select id="fs"><option value="">Any status</option><option value="todo">Todo</option><option value="att">Attempted</option><option value="done">Solved</option></select>
                <span class="mu sm" id="cnt"></span></div>
            <div id="list"></div>
        </aside>
        <section>
            <div id="prob">
                <p class="mu">Pick a problem from the list to begin.</p>
            </div>
            <div class="tabs"><span class="fn" id="fname">solution.js</span><span class="sp"></span>
                <select id="lg" title="Language"><option value="js">JavaScript</option><option value="py">Python</option></select><select id="st"><option value="todo">Todo</option><option value="att">Attempted</option><option value="done">Solved</option></select>
                <button id="rs">Reset</button><button class="pr" id="run">▶ Run (Ctrl+Enter)</button></div>
            <div class="ed">
                <div id="ln">1</div><textarea id="code" spellcheck="false" autocapitalize="off"></textarea></div>
            <div id="out"></div>
        </section>
    </main>

            "GCD of Two Numbers": ["gcd", "a, b", [
                [
                    [48, 18], 6
                ],
                [
                    [7, 13], 1
                ]
            ]],
            "Sum of Digits": ["sumOfDigits", "n", [
                [
                    [1234], 10
                ],
                [
                    [0], 0
                ]
            ]],
            "Pow(x, n)": ["myPow", "x, n", [
                [
                    [2, 10], 1024
                ],
                [
                    [2, -2], 0.25
                ]
            ]]
        };
        const DN = {
            E: "Easy",
            M: "Medium",
            H: "Hard"
        };
        const P = [];
        for (const tp in RAW) RAW[tp].trim().split("\n").forEach(l => {
            const a = l.split("|"),
                t = a[1],
                x = T[t];
            P.push({
                k: tp + "@" + t,
                t,
                d: a[0],
                tp,
                s: a[2] || "",
                fn: x && x[0],
                a: x && x[1],
                tc: x && x[2]
            })
        });
        const TOPICS = Object.keys(RAW);
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>]/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;"
        }[c]));
        const KEY = "codearena_v2";
        let S = {},
            cur = null,
            tm, topic = "";
        try {
            S = JSON.parse(localStorage.getItem(KEY) || "{}") || {}
        } catch (e) {
            S = {}
        }
        const save = () => {
            try {
                localStorage.setItem(KEY, JSON.stringify(S))
            } catch (e) {}
        };
        const rec = k => S[k] || (S[k] = {
            s: "todo",
            c: ""
        });
        const ymd = d => d.toLocaleDateString("en-CA");
        const today = () => ymd(new Date());
        const fnName = p => {
            if (p.fn) return p.fn;
            let w = p.t.replace(/[^a-zA-Z0-9 ]/g, "").split(" ").filter(Boolean);
            let n = w[0].toLowerCase() + w.slice(1).map(x => x[0].toUpperCase() + x.slice(1).toLowerCase()).join("");
            return /^[0-9]/.test(n) ? "solve" + n : n
        };
        let lang = "js";
        try {
            lang = localStorage.getItem("codearena_lang") === "py" ? "py" : "js"
        } catch (e) {}
        const CK = () => lang === "py" ? "p" : "c";
        const starter = p => lang === "py" ? "# " + p.t + " (" + DN[p.d] + " | " + p.tp + ")\n# " + p.s + "\ndef " + fnName(p) + "(" + (p.a || "input") + "):\n    pass\n" : "/**\n * " + p.t + " (" + DN[p.d] + " | " + p.tp + ")\n * " + p.s + "\n */\nfunction " + fnName(p) + "(" + (p.a || "input") + ") {\n  \n}\n";

        /* ---------- stats ---------- */
        function stats() {
            const c = {
                    E: [0, 0],
                    M: [0, 0],
                    H: [0, 0]
                },
                tc = {};
            TOPICS.forEach(t => tc[t] = [0, 0]);
            P.forEach(p => {
                const d = (S[p.k] || {}).s === "done";
                c[p.d][1]++;
                tc[p.tp][1]++;
                if (d) {
                    c[p.d][0]++;
                    tc[p.tp][0]++
                }
            });
            const n = c.E[0] + c.M[0] + c.H[0];
            $("tot").textContent = "Solved " + n + " / " + P.length;
            $("pe").textContent = "Easy " + c.E.join("/");
            $("pm").textContent = "Medium " + c.M.join("/");
            $("ph").textContent = "Hard " + c.H.join("/");
            $("pb").style.width = (n / P.length * 100) + "%";
            const by = {};
            Object.values(S).forEach(r => {
                if (r.s === "done" && r.at) by[r.at] = (by[r.at] || 0) + 1
            });
            const now = new Date(),
                day = o => {
                    const d = new Date(now);
                    d.setDate(d.getDate() - o);
                    return ymd(d)
                };
            $("today").textContent = "Today: " + (by[day(0)] || 0) + " solved";
            $("yest").textContent = "Yesterday: " + (by[day(1)] || 0) + " solved";
            let st = 0,
                o = by[day(0)] ? 0 : 1;
            while (by[day(o)]) {
                st++;
                o++
            }
            $("streak").textContent = "Streak: " + st + (st ? " 🔥" : "") + " day" + (st === 1 ? "" : "s");
            let h = "";
            for (let i = 13; i >= 0; i--) {
                const v = by[day(i)] || 0;
                h += '<i title="' + day(i) + ": " + v + ' solved" style="' + (v ? "background:var(--e);opacity:" + Math.min(1, .35 + v * .2) : "") + '"></i>'
            }
            $("hist").innerHTML = h;
            $("chips").innerHTML = '<span class="chip' + (topic === "" ? " on" : "") + '" data-t="">All ' + n + "/" + P.length + "</span>" + TOPICS.map(t => '<span class="chip' + (topic === t ? " on" : "") + '" data-t="' + t + '">' + t + " " + tc[t][0] + "/" + tc[t][1] + "</span>").join("");
        }

        function renderList() {
            const q = $("q").value.toLowerCase(),
                d = $("fd").value,
                s = $("fs").value;
            const l = P.filter(p => (!q || p.t.toLowerCase().includes(q)) && (!d || p.d === d) && (!topic || p.tp === topic) && (!s || ((S[p.k] || {}).s || "todo") === s));
            $("cnt").textContent = l.length + " shown";
            $("list").innerHTML = l.map(p => '<div class="it' + (cur && cur.k === p.k ? " on" : "") + '" data-k="' + esc(p.k).replace(/"/g, "&quot;") + '"><i class="dot ' + ((S[p.k] || {}).s || "") + '"></i><span class="t">' + esc(p.t) + '</span><span class="sm ' + p.d + '">' + DN[p.d] + "</span></div>").join("");
            stats();
        }

        function lines() {
            const n = $("code").value.split("\n").length;
            let s = "";
            for (let i = 1; i <= n; i++) s += i + "\n";
            $("ln").textContent = s
        }

        function open(p) {
            cur = p;
            const r = rec(p.k);
            $("prob").innerHTML = "<h2>" + esc(p.t) + '<span class="tag ' + p.d + '">' + DN[p.d] + '</span><span class="tag">' + p.tp + "</span></h2><p>" + esc(p.s) + "</p>" + (p.tc ? '<p class="mu sm">Built-in tests: ' + p.tc.length + " cases. Passing all marks it Solved automatically.</p>" : '<p class="mu sm">Write your solution, test it with console.log (JS) or print (Python), then mark it Solved yourself.</p>');
            $("code").value = r[CK()] || starter(p);
            $("st").value = r.s;
            $("fname").textContent = fnName(p) + (lang === "py" ? ".py" : ".js");
            lines();
            renderList();
            $("out").innerHTML = '<span class="mu">Ready. Your code and progress save automatically on this device.</span>';
        }

        function setStatus(s) {
            if (!cur) return;
            const r = rec(cur.k);
            r.s = s;
            if (s === "done") {
                if (!r.at) r.at = today()
            } else delete r.at;
            $("st").value = s;
            save();
            renderList();
        }
        /* ---------- runner (Web Worker with 4s timeout, falls back to inline) ---------- */
        function runJob(j) {
            const logs = [],
                con = {
                    log: (...a) => logs.push(a.map(x => {
                        try {
                            return typeof x === "string" ? x : JSON.stringify(x)
                        } catch (e) {
                            return String(x)
                        }
                    }).join(" "))
                };
            let fn = null;
            try {
                fn = new Function("console", j.code + "\n;return typeof " + j.name + "==='function'?" + j.name + ":null")(con)
            } catch (e) {
                return {
                    err: e.message,
                    logs
                }
            }
            if (!j.tests) return {
                logs,
                found: !!fn
            };
            if (!fn) return {
                err: "Function " + j.name + " not found",
                logs
            };
            const t0 = Date.now(),
                res = j.tests.map(c => {
                    try {
                        const got = fn(...JSON.parse(JSON.stringify(c[0])));
                        return {
                            ok: JSON.stringify(got) === JSON.stringify(c[1]),
                            got: String(JSON.stringify(got))
                        }
                    } catch (e) {
                        return {
                            ok: false,
                            err: e.message
                        }
                    }
                });
            return {
                res,
                logs,
                ms: Date.now() - t0
            };
        }

        function exec(job) {
            return new Promise(r => {
                let w;
                try {
                    w = new Worker(URL.createObjectURL(new Blob(["const runJob=" + runJob.toString() + ";onmessage=e=>postMessage(runJob(e.data))"], {
                        type: "text/javascript"
                    })))
                } catch (e) {
                    return r(runJob(job))
                }
                const to = setTimeout(() => {
                    w.terminate();
                    r({
                        tle: true
                    })
                }, 4000);
                w.onmessage = e => {
                    clearTimeout(to);
                    w.terminate();
                    r(e.data)
                };
                w.onerror = () => {
                    clearTimeout(to);
                    w.terminate();
                    r(runJob(job))
                };
                w.postMessage(job);
            });
        }
        async function run() {
            if (!cur) return;
            const p = cur,
                code = $("code").value;
            rec(p.k)[CK()] = code;
            save();
            $("out").innerHTML = '<span class="mu">Running…</span>';
            const r = await (lang === "py" ? execPy : exec)({
                code,
                name: fnName(p),
                tests: p.tc
            });
            if (cur !== p) return;
            const lgt = Array.isArray(r.logs) ? r.logs.join("\n") : (r.logs || "");
            const logs = lgt ? '<div class="mu">' + esc(lgt) + "</div>" : "";
            if (r.tle) {
                $("out").innerHTML = '<span class="bad">Time Limit Exceeded (4s). Check for an infinite loop.</span>' + logs;
                if (rec(p.k).s !== "done") setStatus("att");
                return
            }
            if (r.err) {
                $("out").innerHTML = '<span class="bad">' + esc("Error: " + r.err) + "</span>" + logs;
                if (rec(p.k).s === "todo") setStatus("att");
                return
            }
            if (!p.tc) {
                $("out").innerHTML = (logs || '<span class="mu">Ran with no output.</span>');
                if (rec(p.k).s === "todo") setStatus("att");
                return
            }
            let o = "",
                pass = 0;
            r.res.forEach((x, i) => {
                if (x.ok) pass++;
                const c = p.tc[i];
                o += '<div class="' + (x.ok ? "ok" : "bad") + '">' + (x.ok ? "✔" : "✘") + " Case " + (i + 1) + ": " + esc(fnName(p) + "(" + c[0].map(a => JSON.stringify(a)).join(", ") + ")") + (x.ok ? "" : "\n    expected " + esc(JSON.stringify(c[1])) + ", got " + esc(x.err ? "error: " + x.err : x.got)) + "</div>"
            });
            const all = pass === p.tc.length;
            o += '<div class="' + (all ? "ok" : "bad") + '"><b>' + (all ? "Accepted" : "Wrong Answer") + "</b> - " + pass + "/" + p.tc.length + " passed - " + r.ms + " ms</div>" + logs;
            $("out").innerHTML = o;
            if (all) setStatus("done");
            else if (rec(p.k).s !== "done") setStatus("att");
        }
        /* ---------- Python runner (Pyodide in a Web Worker, 4s timeout) ---------- */
        const PYRUN = `def _run(code,name,tests):
    import sys,io,json,traceback,time
    buf=io.StringIO();old=sys.stdout;sys.stdout=buf
    try:
        g={"__name__":"__main__"}
        try:
            exec(code,g)
        except BaseException:
            return {"err":traceback.format_exc().strip().splitlines()[-1],"logs":buf.getvalue()}
        if not tests:
            return {"logs":buf.getvalue()}
        fn=g.get(name)
        if not callable(fn):
            return {"err":"Function "+name+" not found","logs":buf.getvalue()}
        t0=time.time();res=[]
        for a,exp in json.loads(tests):
            try:
                got=json.loads(json.dumps(fn(*json.loads(json.dumps(a)))))
                res.append({"ok":got==exp,"got":json.dumps(got)})
            except Exception as e:
                res.append({"ok":False,"err":str(e)})
        return {"res":res,"logs":buf.getvalue(),"ms":int((time.time()-t0)*1000)}
    finally:
        sys.stdout=old
import json as _j
_j.dumps(_run(_code,_name,_tests))`;
        const PYW = 'const IDX="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";let py=null;const RUNNER=' + JSON.stringify(PYRUN) + ';onmessage=async e=>{const j=e.data;try{if(!py){importScripts(IDX+"pyodide.js");py=await loadPyodide({indexURL:IDX})}py.globals.set("_code",j.code);py.globals.set("_name",j.name);py.globals.set("_tests",j.tests?JSON.stringify(j.tests):"");postMessage(JSON.parse(await py.runPythonAsync(RUNNER)))}catch(err){postMessage({err:String((err&&err.message)||err).split("\\n").slice(-2).join(" ")})}};';
        let pw = null;

        function execPy(job) {
            return new Promise(r => {
                if (!pw) {
                    try {
                        pw = new Worker(URL.createObjectURL(new Blob([PYW], {
                            type: "text/javascript"
                        })))
                    } catch (e) {
                        return r({
                            err: "Could not start the Python engine: " + e.message
                        })
                    }
                }
                const w = pw,
                    ready = !!w.rdy;
                if (!ready) $("out").innerHTML = '<span class="mu">Loading Python (first run downloads about 10 MB and needs internet)…</span>';
                const to = setTimeout(() => {
                    w.terminate();
                    if (pw === w) pw = null;
                    r(ready ? {
                        tle: true
                    } : {
                        err: "Python took too long to load. Check your internet connection and try again."
                    })
                }, ready ? 4000 : 90000);
                w.onmessage = e => {
                    clearTimeout(to);
                    w.rdy = true;
                    r(e.data)
                };
                w.onerror = () => {
                    clearTimeout(to);
                    w.terminate();
                    if (pw === w) pw = null;
                    r({
                        err: "Python engine failed to load. Check your internet connection and try again."
                    })
                };
                w.postMessage(job);
            });
        }
        $("lg").onchange = e => {
            lang = e.target.value === "py" ? "py" : "js";
            try {
                localStorage.setItem("codearena_lang", lang)
            } catch (x) {}
            if (cur) open(cur)
        };
        /* ---------- events ---------- */
        $("list").onclick = e => {
            const it = e.target.closest(".it");
            if (it) {
                const p = P.find(x => x.k === it.dataset.k);
                if (p) open(p)
            }
        };
        $("chips").onclick = e => {
            const c = e.target.closest(".chip");
            if (c) {
                topic = c.dataset.t;
                renderList()
            }
        };
        ["q", "fd", "fs"].forEach(i => $(i).oninput = renderList);
        $("st").onchange = e => setStatus(e.target.value);
        $("run").onclick = run;
        $("nx").onclick = () => {
            const l = P.filter(p => (!topic || p.tp === topic) && ((S[p.k] || {}).s || "todo") !== "done");
            if (l.length) open(l[0]);
            else $("out").textContent = "Nothing left unsolved here. Great work!"
        };
        $("rs").onclick = () => {
            if (cur && confirm("Reset code to the starter template?")) {
                rec(cur.k)[CK()] = "";
                $("code").value = starter(cur);
                lines();
                save()
            }
        };
        $("ex").onclick = () => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {
                type: "application/json"
            }));
            a.download = "codearena-progress-" + today() + ".json";
            a.click()
        };
        $("im").onclick = () => $("fi").click();
        $("fi").onchange = e => {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const o = JSON.parse(r.result);
                    if (o && typeof o === "object") {
                        S = Object.assign(S, o);
                        save();
                        renderList();
                        if (cur) open(cur);
                        alert("Progress imported.")
                    }
                } catch (x) {
                    alert("That file is not a valid CodeArena backup.")
                }
            };
            r.readAsText(f);
            e.target.value = ""
        };
        $("code").addEventListener("input", () => {
            lines();
            if (!cur) return;
            rec(cur.k)[CK()] = $("code").value;
            clearTimeout(tm);
            tm = setTimeout(save, 400)
        });
        $("code").addEventListener("scroll", e => {
            $("ln").scrollTop = e.target.scrollTop
        });
        $("code").addEventListener("keydown", e => {
            const t = e.target;
            if (e.key === "Tab") {
                e.preventDefault();
                t.setRangeText(lang === "py" ? "    " : "  ", t.selectionStart, t.selectionEnd, "end");
                t.dispatchEvent(new Event("input"))
            } else if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                e.preventDefault();
                run()
            } else if (e.key === "Enter") {
                const s = t.selectionStart,
                    ls = t.value.lastIndexOf("\n", s - 1) + 1,
                    seg = t.value.slice(ls, s),
                    ind = (seg.match(/^\s*/) || [""])[0],
                    ex = lang === "py" ? (/:\s*$/.test(seg) ? "    " : "") : (/[{(\[]\s*$/.test(seg) ? "  " : "");
                e.preventDefault();
                t.setRangeText("\n" + ind + ex, s, t.selectionEnd, "end");
                t.dispatchEvent(new Event("input"))
            }
        });
        /* ---------- start ---------- */
        $("lg").value = lang;
        renderList();
        const first = P.find(p => ((S[p.k] || {}).s || "todo") !== "done");
        open(first || P[0]);
    </script>
</body>
