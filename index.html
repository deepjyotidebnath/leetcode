<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CodeArena – 1140 Questions Placement Prep</title>
    <style>
         :root {
            --bg: #1e1e1e;
            --side: #252526;
            --bar: #333;
            --bd: #3c3c3c;
            --tx: #d4d4d4;
            --mut: #8b8b8b;
            --acc: #0e7ad1;
            --e: #4ec9b0;
            --m: #e5b84b;
            --h: #f2616b
        }
        
        * {
            box-sizing: border-box
        }
        
        html,
        body {
            height: 100%;
            margin: 0
        }
        
        body {
            background: var(--bg);
            color: var(--tx);
            font: 14px system-ui, -apple-system, Segoe UI, sans-serif;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }
        
        header {
            background: var(--bar);
            padding: 8px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }
        
        .r1,
        .r2 {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }
        
        .r1 b {
            font-size: 16px
        }
        
        .sp {
            flex: 1
        }
        
        #today {
            border-color: var(--e);
            color: var(--e);
            font-weight: 600
        }
        
        .pill {
            background: #2b2b2b;
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px
        }
        
        .bar {
            width: 120px;
            height: 6px;
            background: #111;
            border-radius: 3px;
            overflow: hidden
        }
        
        .bar i {
            display: block;
            height: 100%;
            background: var(--e)
        }
        
        .hist {
            display: flex;
            gap: 3px;
            align-items: center
        }
        
        .hist i {
            width: 10px;
            height: 14px;
            border-radius: 2px;
            background: #444
        }
        
        .chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px
        }
        
        .chip {
            flex: none;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid var(--bd);
            background: #2b2b2b;
            cursor: pointer;
            white-space: nowrap
        }
        
        .chip.on {
            background: var(--acc);
            border-color: var(--acc);
            color: #fff
        }
        
        main {
            flex: 1;
            display: flex;
            min-height: 0
        }
        
        aside {
            width: 310px;
            background: var(--side);
            border-right: 1px solid var(--bd);
            display: flex;
            flex-direction: column;
            min-height: 0
        }
        
        .flt {
            padding: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px
        }
        
        .flt input {
            grid-column: 1/3
        }
        
        input,
        select,
        button {
            background: #3a3d41;
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 4px;
            padding: 5px 8px;
            font: inherit
        }
        
        button {
            cursor: pointer
        }
        
        button:hover {
            background: #4a4d52
        }
        
        button.pr {
            background: var(--acc);
            border-color: var(--acc);
            color: #fff
        }
        
        #list {
            overflow: auto;
            flex: 1
        }
        
        .it {
            padding: 7px 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d
        }
        
        .it:hover {
            background: #2a2d2e
        }
        
        .it.on {
            background: #37373d
        }
        
        .it .t {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 1px solid var(--mut);
            flex: none
        }
        
        .dot.att {
            background: var(--m);
            border-color: var(--m)
        }
        
        .dot.done {
            background: var(--e);
            border-color: var(--e)
        }
        
        .E {
            color: var(--e)
        }
        
        .M {
            color: var(--m)
        }
        
        .H {
            color: var(--h)
        }
        
        .sm {
            font-size: 11px
        }
        
        .mu {
            color: var(--mut)
        }
        
        .ok {
            color: var(--e)
        }
        
        .bad {
            color: var(--h)
        }
        
        section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0
        }
        
        #prob {
            padding: 10px 14px;
            border-bottom: 1px solid var(--bd);
            max-height: 28%;
            overflow: auto
        }
        
        #prob h2 {
            margin: 0 0 4px;
            font-size: 16px
        }
        
        #prob p {
            margin: 6px 0;
            line-height: 1.5
        }
        
        .tag {
            font-size: 11px;
            background: #3a3d41;
            border-radius: 10px;
            padding: 1px 8px;
            margin-left: 6px;
            color: var(--tx)
        }
        
        .tabs {
            background: var(--side);
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid var(--bd);
            font-size: 12px;
            flex-wrap: wrap
        }
        
        .tabs .fn {
            background: var(--bg);
            padding: 4px 10px;
            border-top: 2px solid var(--acc)
        }
        
        .ed {
            flex: 1;
            display: flex;
            min-height: 120px
        }
        
        #ln {
            padding: 8px 6px;
            text-align: right;
            color: #6b6b6b;
            font: 13px/1.5 Consolas, Menlo, monospace;
            overflow: hidden;
            user-select: none;
            min-width: 38px;
            white-space: pre
        }
        
        #code {
            flex: 1;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--tx);
            font: 13px/1.5 Consolas, Menlo, monospace;
            padding: 8px;
            tab-size: 2;
            white-space: pre;
            overflow: auto
        }
        
        #out {
            height: 28%;
            min-height: 90px;
            overflow: auto;
            background: #181818;
            border-top: 1px solid var(--bd);
            padding: 8px 12px;
            font: 12.5px/1.5 Consolas, Menlo, monospace;
            white-space: pre-wrap
        }
        
        #calm {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9
        }
        
        #calm .box {
            background: var(--side);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 14px;
            width: min(560px, 94vw);
            max-height: 90vh;
            overflow: auto
        }
        
        .ch {
            display: flex;
            gap: 8px;
            align-items: center
        }
        
        #cs {
            margin-top: 8px;
            line-height: 1.5
        }
        
        #cg {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-top: 10px
        }
        
        .cd {
            border: 1px solid var(--bd);
            border-radius: 6px;
            padding: 4px 2px;
            text-align: center;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 10.5px;
            background: #2b2b2b
        }
        
        .cd b {
            font-size: 18px
        }
        
        .cd .dn,
        .cd .dd {
            color: var(--tx);
            opacity: .7
        }
        
        .cd.td {
            outline: 2px solid var(--acc)
        }
        
        .cd.fu {
            opacity: .45
        }
        
        @media(max-width:760px) {
            #cg {
                grid-template-columns: repeat(5, 1fr)
            }
        }
        
        @media(max-width:760px) {
            main {
                flex-direction: column
            }
            aside {
                width: 100%;
                height: 36%;
                border-right: 0;
                border-bottom: 1px solid var(--bd)
            }
            #prob {
                max-height: 26%
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="r1"><b>⌨️ CodeArena</b><span class="pill" id="tot"></span><span class="pill E" id="pe"></span><span class="pill M" id="pm"></span><span class="pill H" id="ph"></span>
            <div class="bar"><i id="pb" style="width:0"></i></div><span class="sp"></span>
            <button id="cal">📅 30-Day Calendar</button><button id="nx">Next unsolved ▶</button><button id="ex">Export</button><button id="im">Import</button><input type="file" id="fi" accept=".json" hidden></div>
        <div class="r2"><span class="pill" id="today"></span><span class="pill" id="yest"></span><span class="pill" id="streak"></span><span class="pill" id="sv"></span><span class="hist" id="hist" title="Last 14 days (oldest → today)"></span></div>
        <div class="chips" id="chips"></div>
    </header>
    <div id="calm">
        <div class="box">
            <div class="ch"><b>📅 30-Day Calendar</b><span class="sp"></span><button id="cr">Restart from today</button><button id="cx">✕</button></div>
            <div id="cs" class="mu sm"></div>
            <div id="cg"></div>
        </div>
    </div>
    <main>
        <aside>
            <div class="flt"><input id="q" placeholder="Search problems…">
                <select id="fd"><option value="">All levels</option><option value="E">Easy</option><option value="M">Medium</option><option value="H">Hard</option></select>
                <select id="fs"><option value="">Any status</option><option value="todo">Todo</option><option value="att">Attempted</option><option value="done">Solved</option></select>
                <span class="mu sm" id="cnt"></span></div>
            <div id="list"></div>
        </aside>
        <section>
            <div id="prob">
                <p class="mu">Pick a problem from the list to begin.</p>
            </div>
            <div class="tabs"><span class="fn" id="fname">solution.js</span><span class="sp"></span>
                <select id="lg" title="Language"><option value="js">JavaScript</option><option value="py">Python</option></select><select id="st"><option value="todo">Todo</option><option value="att">Attempted</option><option value="done">Solved</option></select>
                <button id="rs">Reset</button><button class="pr" id="run">▶ Run (Ctrl+Enter)</button></div>
            <div class="ed">
                <div id="ln">1</div><textarea id="code" spellcheck="false" autocapitalize="off"></textarea></div>
            <div id="out"></div>
        </section>
    </main>
